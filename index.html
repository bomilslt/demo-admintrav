<!DOCTYPE html>
<html lang="fr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERCITY Admin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Mapbox GL -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="utils/mapbox/mapbox-3D-style.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components/date-picker.css">

    <style>
        /* CRITICAL SPLASH CSS */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #042d52;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        }

        #splash-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, #042d52 90%);
            pointer-events: none;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 2;
        }

        .splash-logo-tenant {
            max-width: 180px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            animation: pulse-logo 3s infinite ease-in-out;
        }

        .splash-loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #60a5fa;
            /* Lighter blue */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .splash-footer {
            position: absolute;
            bottom: 30px;
            opacity: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: #94a3b8;
            z-index: 2;
        }

        .splash-logo-creator {
            height: 110px !important;
            width: auto !important;
            margin-top: 8px;
            filter: grayscale(100%) brightness(1.5);
            transition: filter 0.3s;
            
        }

        .splash-logo-creator:hover {
            filter: grayscale(0%) brightness(1);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse-logo {

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="images/logos/logo_tenant.png" alt="Logo" class="splash-logo-tenant"
                onerror="this.style.display='none'">
            <div class="splash-loader"></div>
            <h2 style="font-family: inherit; font-weight: 500; color: #f1f5f9; letter-spacing: 0.5px;">INTERCITY ADMIN
            </h2>
        </div>
        <div class="splash-footer">
            <span>Propulsé par</span>
            <img src="images/logos/logo_entreprise.png" alt="BOMIL SOLUTIONS" class="splash-logo-creator">
        </div>
    </div>

    <div class="app-container">

                        <circle cx="18.5" cy="18.5" r="2.5" />

                    <span>Réservations</span>

                    </svg>

                </a>
                <a href="#/fleet" class="nav-link" data-route="fleet">

                        <rect x="1" y="3" width="15" height="13"></rect>
                        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                        <circle cx="5.5" cy="18.5" r="2.5"></circle>
                        <circle cx="18.5" cy="18.5" r="2.5"></circle>
                    </svg>
                    <span>Véhicules</span>
                </a>
                <a href="#/drivers" class="nav-link" data-route="drivers">

        <!-- Main -->

            <!-- Header -->

</html>
