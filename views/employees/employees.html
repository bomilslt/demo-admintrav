<!-- 
    EMPLOYEES VIEW - Staff Management
    ==================================
-->

<div class="view-employees">
    <!-- Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">👥 Gestion des Employés</h1>
            <p class="page-subtitle">Chauffeurs, guichetiers et gestionnaires</p>
        </div>
        <div class="header-actions">
            <button type="button" class="btn btn-primary" id="btn-add-employee">
                <svg class="icon-svg" style="width:18px;height:18px;margin-right:6px" viewBox="0 0 24 24">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Nouvel Employé
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-tabs">
            <button type="button" class="filter-tab active" data-filter="all">Tous</button>
            <button type="button" class="filter-tab" data-filter="driver">Chauffeurs</button>
            <button type="button" class="filter-tab" data-filter="agent">Guichetiers</button>
            <button type="button" class="filter-tab" data-filter="manager">Managers</button>
        </div>
        <div class="search-filter">
            <div class="search-premium-container">
                <svg class="search-premium-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-premium-input" id="search-employee" placeholder="Rechercher par nom..."
                    autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Employees Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Employé</th>
                        <th>Rôle</th>
                        <th>Agence</th>
                        <th>Contact</th>
                        <th>Statut</th>
                        <th>Performance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employees-table">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Add/Edit Employee -->
<div id="modal-employee" class="modal-overlay global-modal">
    <div class="modal-dialog wide">
        <div class="modal-header">
            <h3 id="modal-employee-title">Nouvel Employé</h3>
            <button class="modal-close-x modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="employee-id">

            <div class="form-row">
                <div class="form-section">
                    <label>Nom complet *</label>
                    <input type="text" class="form-input" id="employee-name" placeholder="Jean Dupont">
                </div>
                <div class="form-section">
                    <label>Téléphone *</label>
                    <input type="tel" class="form-input" id="employee-phone" placeholder="+237 6XX XXX XXX">
                </div>
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label>Rôle *</label>
                    <select class="form-select" id="employee-role">
                        <option value="">Sélectionner...</option>
                        <option value="driver">Chauffeur</option>
                        <option value="guichet">Guichetier</option>
                        <option value="colis">Agent Colis</option>
                        <option value="manager">Manager</option>
                        <option value="superadmin">Superadmin</option>
                    </select>
                </div>
                <div class="form-section">
                    <label>Agence *</label>
                    <div id="single-agency-container">
                        <select class="form-select" id="employee-agency">
                            <option value="">Chargement...</option>
                        </select>
                    </div>
                    <div id="managed-agencies-container"
                        style="display: none; height: 150px; overflow-y: auto; border: 1px solid #d1d5db; padding: 10px; border-radius: 6px;">
                        <!-- Checkboxes injected by JS -->
                        <div class="text-muted text-small">Chargement...</div>
                    </div>
                </div>
            </div>

            <div class="form-divider">Accès & Sécurité</div>
            <div class="form-row">
                <div class="form-section">
                    <label>Email (Identifiant) *</label>
                    <input type="email" class="form-input" id="employee-email" placeholder="email@example.com" required>
                </div>
                <div class="form-section">
                    <label>Mot de passe *</label>
                    <div class="password-group">
                        <input type="password" class="form-input" id="employee-password" placeholder="••••••••"
                            autocomplete="new-password">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <label>CNI / Numéro ID</label>
                <input type="text" class="form-input" id="employee-cni" placeholder="Numéro CNI">
            </div>

            <!-- Driver-specific fields -->
            <div id="driver-fields" style="display: none;">
                <div class="form-divider">Informations Chauffeur</div>
                <div class="form-row">
                    <div class="form-section">
                        <label>Numéro Permis</label>
                        <input type="text" class="form-input" id="employee-license" placeholder="Permis de conduire">
                    </div>
                    <div class="form-section">
                        <label>Véhicule assigné</label>
                        <select class="form-select" id="employee-vehicle">
                            <option value="">Chargement...</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-text modal-close">Annuler</button>
            <button class="btn btn-primary" id="btn-save-employee">Enregistrer</button>
        </div>
    </div>
</div>

<style>

        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 16px;
    }

    .filter-tabs {
        display: flex;
        gap: 8px;
    }

    .filter-tab {
        padding: 8px 16px;
        border: 1px solid #e5e7eb;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.15s;
    }

    .filter-tab:hover {
        border-color: #3b82f6;
        color: #3b82f6;
    }

    .filter-tab.active {
        background: #3b82f6;
        color: white;
        border-color: #3b82f6;
    }

    .search-filter {
        min-width: 300px;
    }

    /* Employee Row */
    .employee-cell {

        align-items: center;
        gap: 12px;
    }

    .employee-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;

        font-weight: 600;
        font-size: 0.8rem;
        color: #374151;
    }

        background: #f59e0b;
    }

        max-width: 600px;

        display: grid;
        grid-template-columns: 1fr 1fr;

    }

    .form-divider {

        border-top: 1px solid #e5e7eb;

        color: #374151;
    }

    /* Action buttons */
    .action-buttons {
        display: flex;
        gap: 6px;
    }

    .btn-icon {
        background: white;
        border: 1px solid #e5e7eb;

    }

    .btn-icon:hover {

    }

        border-color: #fecaca;
    }
</style>
