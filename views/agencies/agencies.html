<!-- 
    AGENCIES VIEW - Branch Management
    ==================================
-->

<div class="view-agencies">
    <!-- Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">🏢 Gestion des Agences</h1>
            <p class="page-subtitle">Points de vente et gares routières</p>
        </div>
        <button class="btn btn-primary" id="btn-add-agency">
            <svg class="icon-svg" style="width:18px;height:18px;margin-right:6px" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nouvelle Agence
        </button>
    </div>

    <!-- Stats Cards -->
    <div class="agency-stats">
        <div class="stat-card">
            <span class="stat-number" id="stat-total-agencies">0</span>
            <span class="stat-label">Agences</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="stat-active-agencies">0</span>
            <span class="stat-label">Actives</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="stat-total-staff">0</span>
            <span class="stat-label">Employés</span>
        </div>
    </div>

    <!-- Agencies Grid -->
    <div class="agencies-grid" id="agencies-grid">
        <!-- Populated by JS -->
    </div>
</div>

<!-- Modal: Add/Edit Agency -->
<div id="modal-agency" class="modal-overlay global-modal">
    <div class="modal-dialog wide">
        <div class="modal-header">
            <h3 id="modal-agency-title">Nouvelle Agence</h3>
            <button class="modal-close-x modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="agency-id">

            <div class="form-section">
                <label>Nom de l'agence *</label>
                <input type="text" class="form-input" id="agency-name" placeholder="Ex: Yaoundé Central">
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label>Ville *</label>
                    <input type="text" class="form-input" id="agency-city" placeholder="Yaoundé">
                </div>
                <div class="form-section">
                    <label>Quartier *</label>
                    <input type="text" class="form-input" id="agency-district" placeholder="Mvan">
                </div>
            </div>

            <div class="form-divider">Localisation (Pour la carte)</div>
            <div class="form-row">
                <div class="form-section">
                    <label>Latitude</label>
                    <input type="number" step="0.000001" class="form-input" id="agency-lat" placeholder="3.8480">
                </div>
                <div class="form-section">
                    <label>Longitude</label>
                    <input type="number" step="0.000001" class="form-input" id="agency-lng" placeholder="11.5021">
                </div>
            </div>

            <div class="form-section">
                <label>Adresse complète</label>
                <input type="text" class="form-input" id="agency-address" placeholder="Rue, numéro, repères...">
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label>Téléphone *</label>
                    <input type="tel" class="form-input" id="agency-phone" placeholder="+237 6XX XXX XXX">
                </div>
                <div class="form-section">
                    <label>Manager</label>
                    <select class="form-select" id="agency-manager">
                        <option value="">Sélectionner...</option>
                        <!-- Populated dynamically -->
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label>Horaires d'ouverture</label>
                    <input type="text" class="form-input" id="agency-hours" placeholder="06:00 - 20:00">
                </div>
                <div class="form-section">
                    <label>Statut</label>
                    <select class="form-select" id="agency-status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-text modal-close">Annuler</button>
            <button class="btn btn-primary" id="btn-save-agency">Enregistrer</button>
        </div>
    </div>
</div>
