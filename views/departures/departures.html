<div class="view-departures">
    <div class="page-header">
        <div>
            <h1 class="page-title">Départs</h1>
            <p class="page-subtitle">Gestion des trajets</p>
        </div>
        <button class="btn btn-primary" id="btn-add-departure">
            <svg class="icon-svg" style="width:18px;height:18px;margin-right:6px" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nouveau départ
        </button>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Tous</button>
            <button class="filter-tab" data-filter="in_progress">En cours</button>
            <button class="filter-tab" data-filter="pending">À venir</button>
            <button class="filter-tab" data-filter="completed">Terminés</button>
        </div>
        <div class="advanced-filters" style="display: flex; gap: 12px; align-items: center;">
            <div id="date-from-container" style="width: 150px;"></div>
            <div id="date-to-container" style="width: 150px;"></div>
            <button class="btn btn-secondary btn-icon" id="reset-filters-btn" title="Réinitialiser">
                <svg class="icon-svg" style="width:18px;height:18px" viewBox="0 0 24 24">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Trajet</th>
                        <th>Date</th>
                        <th>Heure</th>
                        <th>Chauffeur</th>
                        <th>Véhicule</th>
                        <th>Places</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="departures-table">
                    <!-- Loaded by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Add/Edit Departure -->
<div id="modal-departure" class="modal-overlay global-modal">
    <div class="modal-dialog">
        <div class="modal-header">
            <h3 id="modal-departure-title">Nouveau Départ</h3>
            <button class="modal-close-x modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="departure-id">

            <div class="form-section">
                <label>Trajet / Route *</label>
                <select class="form-select" id="dep-route">
                    <option value="">Sélectionner une route...</option>
                    <!-- Dynamic -->
                </select>
                <!-- Hidden fields to store derived values -->
                <input type="hidden" id="dep-origin">
                <input type="hidden" id="dep-destination">
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label>Date *</label>
                    <input type="date" class="form-input" id="dep-date">
                </div>
                <div class="form-section">
                    <label>Heure *</label>
                    <input type="time" class="form-input" id="dep-time">
                </div>
            </div>

            <div class="form-section">
                <label>Chauffeur</label>
                <select class="form-select" id="dep-driver">
                    <option value="">Sélectionner...</option>
                    <!-- Dynamic -->
                </select>
            </div>

            <div class="form-section">
                <label>Véhicule</label>
                <select class="form-select" id="dep-vehicle">
                    <option value="">Sélectionner...</option>
                    <!-- Dynamic -->
                </select>
            </div>

            <div class="form-section">
                <label>Prix du ticket (FCFA)</label>
                <input type="number" class="form-input" id="dep-price" value="5000">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-text modal-close">Annuler</button>
            <button class="btn btn-primary" id="btn-save-departure">Enregistrer</button>
        </div>
    </div>
</div>
